<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo pedido - Plumita Gris</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container mt-4">
    <h2>Nuevo pedido</h2>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/pedidos}" th:object="${pedidoForm}" method="post" class="bg-white p-4 rounded shadow-sm">

        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label">Cliente</label>
                <select class="form-select" th:field="*{idCliente}">
                    <option value="">-- Seleccione --</option>
                    <option th:each="c : ${clientes}"
                            th:value="${c.idCliente}"
                            th:text="${c.usuario != null ? c.usuario.nombre : ('Cliente #' + c.idCliente)}"></option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Modalidad de entrega</label>
                <select class="form-select" th:field="*{idModalidadEntrega}">
                    <option value="">-- Seleccione --</option>
                    <option th:each="m : ${modalidades}" th:value="${m.idModalidadEntrega}" th:text="${m.nombre}"></option>
                </select>
            </div>
        </div>

        <h5 class="mt-4">Productos disponibles</h5>
        <table class="table table-bordered">
            <thead class="table-light">
            <tr>
                <th>Producto</th>
                <th>Precio</th>
                <th style="width:120px;">Cantidad</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="linea, iter : *{lineas}">
                <td th:text="${linea.nombreProducto}"></td>
                <td th:text="${'$' + linea.precio}"></td>
                <td>
                    <input type="hidden" th:field="*{lineas[__${iter.index}__].idProducto}">
                    <input type="hidden" th:field="*{lineas[__${iter.index}__].nombreProducto}">
                    <input type="hidden" th:field="*{lineas[__${iter.index}__].precio}">
                    <input type="number" min="0" class="form-control"
                           th:field="*{lineas[__${iter.index}__].cantidad}">
                </td>
            </tr>
            <tr th:if="${pedidoForm.lineas == null || pedidoForm.lineas.isEmpty()}">
                <td colspan="3" class="text-center text-muted">No hay productos con stock disponible.</td>
            </tr>
            </tbody>
        </table>

        <button type="submit" class="btn btn-primary">Registrar pedido</button>
        <a href="/pedidos" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>

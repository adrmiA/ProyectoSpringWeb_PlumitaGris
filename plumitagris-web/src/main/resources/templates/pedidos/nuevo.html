<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo pedido - Plumita Gris</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container pg-page" style="max-width: 820px;">
    <div class="pg-page-header">
        <h2>Nuevo pedido</h2>
    </div>

    <div th:if="${error}" class="pg-alert pg-alert-danger" th:text="${error}"></div>

    <form th:action="@{/pedidos}" th:object="${pedidoForm}" method="post" class="pg-form-card">

        <div class="row mb-3">
            <div class="col-12 col-md-6 mb-3 mb-md-0">
                <label class="form-label">Cliente</label>
                <select class="form-select" th:field="*{idCliente}">
                    <option value="">-- Seleccione --</option>
                    <option th:each="c : ${clientes}"
                            th:value="${c.idCliente}"
                            th:text="${c.usuario != null ? c.usuario.nombre : ('Cliente #' + c.idCliente)}"></option>
                </select>
            </div>
            <div class="col-12 col-md-6">
                <label class="form-label">Modalidad de entrega</label>
                <select class="form-select" th:field="*{idModalidadEntrega}">
                    <option value="">-- Seleccione --</option>
                    <option th:each="m : ${modalidades}" th:value="${m.idModalidadEntrega}" th:text="${m.nombre}"></option>
                </select>
            </div>
        </div>

        <h5 class="mt-4 mb-3" style="font-weight:600;">Productos disponibles</h5>
        <div class="pg-table-wrap mb-3">
            <table class="pg-table" th:if="${pedidoForm.lineas != null and !pedidoForm.lineas.isEmpty()}">
                <thead>
                <tr>
                    <th>Producto</th>
                    <th>Precio</th>
                    <th style="width:120px;">Cantidad</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="linea, iter : *{lineas}">
                    <td th:text="${linea.nombreProducto}"></td>
                    <td th:text="${'$' + linea.precio}"></td>
                    <td>
                        <input type="hidden" th:field="*{lineas[__${iter.index}__].idProducto}">
                        <input type="hidden" th:field="*{lineas[__${iter.index}__].nombreProducto}">
                        <input type="hidden" th:field="*{lineas[__${iter.index}__].precio}">
                        <input type="number" min="0" class="form-control"
                               th:field="*{lineas[__${iter.index}__].cantidad}">
                    </td>
                </tr>
                </tbody>
            </table>
            <div class="pg-empty" th:if="${pedidoForm.lineas == null || pedidoForm.lineas.isEmpty()}">
                No hay productos con stock disponible.
            </div>
        </div>

        <div class="d-flex gap-2 mt-3">
            <button type="submit" class="btn-pg-primary">Registrar pedido</button>
            <a href="/pedidos" class="btn-pg-outline">Cancelar</a>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pedidos - Plumita Gris</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Pedidos</h2>
        <a href="/pedidos/nuevo" class="btn btn-success">+ Nuevo pedido</a>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <table class="table table-striped table-bordered bg-white">
        <thead class="table-dark">
        <tr>
            <th>#</th>
            <th>Cliente</th>
            <th>Fecha</th>
            <th>Modalidad</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="pe : ${pedidos}">
            <td th:text="${pe.idPedido}"></td>
            <td th:text="${pe.cliente != null and pe.cliente.usuario != null ? pe.cliente.usuario.nombre : '-'}"></td>
            <td th:text="${#strings.substring(pe.fechaPedido, 0, 10)}"></td>
            <td th:text="${pe.modalidadEntrega != null ? pe.modalidadEntrega.nombre : '-'}"></td>
            <td>
                <span class="badge bg-info" th:text="${pe.estadoPedido != null ? pe.estadoPedido.nombre : '-'}"></span>
            </td>
            <td>
                <a th:href="@{/pedidos/{id}(id=${pe.idPedido})}" class="btn btn-sm btn-primary">Ver</a>
            </td>
        </tr>
        <tr th:if="${pedidos == null || pedidos.isEmpty()}">
            <td colspan="6" class="text-center text-muted">No hay pedidos registrados.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>

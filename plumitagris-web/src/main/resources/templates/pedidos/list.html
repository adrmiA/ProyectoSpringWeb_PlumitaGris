<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos - Plumita Gris</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container pg-page">
    <div class="pg-page-header">
        <h2>Pedidos</h2>
        <a href="/pedidos/nuevo" class="btn-pg-primary"><i class="bi bi-plus-lg me-1"></i>Nuevo pedido</a>
    </div>

    <div th:if="${success}" class="pg-alert pg-alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="pg-alert pg-alert-danger" th:text="${error}"></div>

    <div class="pg-filters">
        <select class="pg-filter-select" id="pgFiltroModalidad">
            <option value="__todos__">Modalidad de entrega</option>
        </select>
        <select class="pg-filter-select" id="pgFiltroEstado">
            <option value="__todos__">Estado</option>
        </select>
    </div>

    <div class="pg-table-wrap">
        <table class="pg-table" id="pgPedidosTable" th:if="${pedidos != null and !pedidos.isEmpty()}">
            <thead>
            <tr>
                <th>Cliente</th>
                <th>Fecha</th>
                <th>Modalidad</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="pe : ${pedidos}"
                th:attr="data-modalidad=${pe.modalidadEntrega != null ? pe.modalidadEntrega.nombre : 'Sin modalidad'},
                         data-estado=${pe.estadoPedido != null ? pe.estadoPedido.nombre : 'Sin estado'}">
                <td th:text="${pe.cliente != null and pe.cliente.usuario != null ? pe.cliente.usuario.nombre : '-'}"></td>
                <td th:text="${#strings.substring(pe.fechaPedido, 0, 10)}"></td>
                <td th:text="${pe.modalidadEntrega != null ? pe.modalidadEntrega.nombre : '-'}"></td>
                <td><span class="pg-badge" th:text="${pe.estadoPedido != null ? pe.estadoPedido.nombre : '-'}"></span></td>
                <td>
                    <a th:href="@{/pedidos/{id}(id=${pe.idPedido})}" class="btn-pg-outline">Ver</a>
                </td>
            </tr>
            </tbody>
        </table>
        <div class="pg-empty" id="pgNoPedidos" th:if="${pedidos == null || pedidos.isEmpty()}">
            No hay pedidos registrados.
        </div>
        <div class="pg-empty pg-hidden" id="pgNoMatchPedidos">
            No hay pedidos que coincidan con el filtro.
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    (function () {
        var rows = Array.prototype.slice.call(document.querySelectorAll('#pgPedidosTable tbody tr'));
        var selectModalidad = document.getElementById('pgFiltroModalidad');
        var selectEstado = document.getElementById('pgFiltroEstado');
        var noMatch = document.getElementById('pgNoMatchPedidos');

        if (!rows.length) return;

        function fillOptions(select, values) {
            values.forEach(function (v) {
                var opt = document.createElement('option');
                opt.value = v;
                opt.textContent = v;
                select.appendChild(opt);
            });
        }

        var modalidades = [], estados = [];
        rows.forEach(function (row) {
            var m = row.getAttribute('data-modalidad');
            var e = row.getAttribute('data-estado');
            if (m && modalidades.indexOf(m) === -1) modalidades.push(m);
            if (e && estados.indexOf(e) === -1) estados.push(e);
        });

        fillOptions(selectModalidad, modalidades);
        fillOptions(selectEstado, estados);

        function aplicarFiltros() {
            var modalidad = selectModalidad.value;
            var estado = selectEstado.value;
            var visibleCount = 0;

            rows.forEach(function (row) {
                var matchModalidad = modalidad === '__todos__' || row.getAttribute('data-modalidad') === modalidad;
                var matchEstado = estado === '__todos__' || row.getAttribute('data-estado') === estado;
                var match = matchModalidad && matchEstado;
                row.classList.toggle('pg-hidden', !match);
                if (match) visibleCount++;
            });

            noMatch.classList.toggle('pg-hidden', visibleCount !== 0);
        }

        selectModalidad.addEventListener('change', aplicarFiltros);
        selectEstado.addEventListener('change', aplicarFiltros);
    })();
</script>
</body>
</html>

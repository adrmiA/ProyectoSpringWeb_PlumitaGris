<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido - Plumita Gris</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container pg-page" style="max-width: 860px;">
    <div class="pg-page-header">
        <h2 th:text="'Pedido #' + ${pedido.idPedido}"></h2>
    </div>

    <div th:if="${success}" class="pg-alert pg-alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="pg-alert pg-alert-danger" th:text="${error}"></div>

    <div class="pg-card mb-4">
        <div class="row">
            <div class="col-12 col-sm-6 mb-2">
                <p class="mb-0" style="color: var(--pg-text-muted); font-size:0.8rem;">CLIENTE</p>
                <p class="mb-0" th:text="${pedido.cliente != null and pedido.cliente.usuario != null ? pedido.cliente.usuario.nombre : '-'}"></p>
            </div>
            <div class="col-12 col-sm-6 mb-2">
                <p class="mb-0" style="color: var(--pg-text-muted); font-size:0.8rem;">FECHA</p>
                <p class="mb-0" th:text="${#strings.substring(pedido.fechaPedido, 0, 10)}"></p>
            </div>
            <div class="col-12 col-sm-6 mb-2">
                <p class="mb-0" style="color: var(--pg-text-muted); font-size:0.8rem;">MODALIDAD DE ENTREGA</p>
                <p class="mb-0" th:text="${pedido.modalidadEntrega != null ? pedido.modalidadEntrega.nombre : '-'}"></p>
            </div>
            <div class="col-12 col-sm-6 mb-2">
                <p class="mb-0" style="color: var(--pg-text-muted); font-size:0.8rem;">ESTADO ACTUAL</p>
                <span class="pg-badge" th:text="${pedido.estadoPedido != null ? pedido.estadoPedido.nombre : '-'}"></span>
            </div>
        </div>
    </div>

    <h5 class="mb-3" style="font-weight:600;">Productos del pedido</h5>
    <div class="pg-table-wrap mb-4">
        <table class="pg-table">
            <thead>
            <tr>
                <th>Producto</th>
                <th>Cantidad</th>
                <th>Subtotal</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="d : ${pedido.detalles}">
                <td th:text="${d.producto != null ? d.producto.nombre : ('Producto #' + d.idProducto)}"></td>
                <td th:text="${d.cantidad}"></td>
                <td th:text="${'$' + d.subtotal}"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="row g-3">
        <div class="col-12 col-md-6">
            <div class="pg-card">
                <h6 class="mb-3">Cambiar estado</h6>
                <form th:action="@{/pedidos/{id}/estado(id=${pedido.idPedido})}" method="post" class="d-flex flex-column flex-sm-row gap-2">
                    <select name="idEstadoPedido" class="form-select">
                        <option th:each="e : ${estados}" th:value="${e.idEstadoPedido}" th:text="${e.nombre}"
                                th:selected="${pedido.estadoPedido != null and e.idEstadoPedido == pedido.estadoPedido.idEstadoPedido}"></option>
                    </select>
                    <button type="submit" class="btn-pg-primary text-nowrap">Actualizar</button>
                </form>
            </div>
        </div>
        <div class="col-12 col-md-6">
            <div class="pg-card d-flex flex-column justify-content-center">
                <h6 class="mb-3">Eliminar pedido</h6>
                <form th:action="@{/pedidos/{id}/eliminar(id=${pedido.idPedido})}" method="post"
                      onsubmit="return confirm('¿Eliminar este pedido?');">
                    <button type="submit" class="btn-pg-danger w-100">Eliminar pedido</button>
                </form>
            </div>
        </div>
    </div>

    <a href="/pedidos" class="btn-pg-outline d-inline-flex mt-4">Volver al listado</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

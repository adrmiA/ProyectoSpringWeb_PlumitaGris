<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pedido - Plumita Gris</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container mt-4">
    <h2 th:text="'Pedido #' + ${pedido.idPedido}"></h2>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card mb-4">
        <div class="card-body">
            <p><strong>Cliente:</strong>
                <span th:text="${pedido.cliente != null and pedido.cliente.usuario != null ? pedido.cliente.usuario.nombre : '-'}"></span>
            </p>
            <p><strong>Fecha:</strong> <span th:text="${#strings.substring(pedido.fechaPedido, 0, 10)}"></span></p>
            <p><strong>Modalidad de entrega:</strong>
                <span th:text="${pedido.modalidadEntrega != null ? pedido.modalidadEntrega.nombre : '-'}"></span>
            </p>
            <p><strong>Estado actual:</strong>
                <span class="badge bg-info" th:text="${pedido.estadoPedido != null ? pedido.estadoPedido.nombre : '-'}"></span>
            </p>
        </div>
    </div>

    <h5>Productos del pedido</h5>
    <table class="table table-bordered bg-white">
        <thead class="table-dark">
        <tr>
            <th>Producto</th>
            <th>Cantidad</th>
            <th>Subtotal</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="d : ${pedido.detalles}">
            <td th:text="${d.producto != null ? d.producto.nombre : ('Producto #' + d.idProducto)}"></td>
            <td th:text="${d.cantidad}"></td>
            <td th:text="${'$' + d.subtotal}"></td>
        </tr>
        </tbody>
    </table>

    <div class="row mt-4">
        <div class="col-md-6">
            <h5>Cambiar estado</h5>
            <form th:action="@{/pedidos/{id}/estado(id=${pedido.idPedido})}" method="post" class="d-flex gap-2">
                <select name="idEstadoPedido" class="form-select">
                    <option th:each="e : ${estados}" th:value="${e.idEstadoPedido}" th:text="${e.nombre}"
                            th:selected="${pedido.estadoPedido != null and e.idEstadoPedido == pedido.estadoPedido.idEstadoPedido}"></option>
                </select>
                <button type="submit" class="btn btn-primary">Actualizar</button>
            </form>
        </div>
        <div class="col-md-6 text-end">
            <form th:action="@{/pedidos/{id}/eliminar(id=${pedido.idPedido})}" method="post"
                  onsubmit="return confirm('¿Eliminar este pedido?');">
                <button type="submit" class="btn btn-danger">Eliminar pedido</button>
            </form>
        </div>
    </div>

    <a href="/pedidos" class="btn btn-secondary mt-4">Volver al listado</a>
</div>
</body>
</html>

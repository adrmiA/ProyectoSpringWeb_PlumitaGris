<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${editar} ? 'Editar producto' : 'Nuevo producto'">Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container mt-4">
    <h2 th:text="${editar} ? 'Editar producto' : 'Nuevo producto'"></h2>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="${editar} ? @{/productos/{id}(id=${producto.idProducto})} : @{/productos}"
          th:object="${producto}" method="post" class="bg-white p-4 rounded shadow-sm">

        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" class="form-control" th:field="*{nombre}">
            <div class="text-danger" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Descripción</label>
            <textarea class="form-control" th:field="*{descripcion}"></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Precio</label>
            <input type="number" step="0.01" class="form-control" th:field="*{precio}">
            <div class="text-danger" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Categoría</label>
            <select class="form-select" th:field="*{idCategoria}">
                <option value="">-- Seleccione --</option>
                <option th:each="c : ${categorias}" th:value="${c.idCategoria}" th:text="${c.nombre}"></option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('idCategoria')}" th:errors="*{idCategoria}"></div>
        </div>

        <button type="submit" class="btn btn-primary">Guardar</button>
        <a href="/productos" class="btn btn-secondary">Cancelar</a>
    </form>

    <div th:if="${editar}" class="bg-white p-4 rounded shadow-sm mt-3">
        <h5>Imagen del producto</h5>

        <img th:if="${producto.imagenUrl != null}"
             th:src="${fileBaseUrl + producto.imagenUrl}"
             alt="Imagen del producto" class="img-thumbnail mb-3" style="max-width: 200px;">
        <p th:unless="${producto.imagenUrl != null}" class="text-muted">Este producto aún no tiene imagen.</p>

        <form th:action="@{/productos/{id}/imagen(id=${producto.idProducto})}"
              method="post" enctype="multipart/form-data" class="d-flex gap-2 align-items-center">
            <input type="file" name="archivo" accept=".jpg,.jpeg,.png,.webp" class="form-control" required>
            <button type="submit" class="btn btn-outline-primary text-nowrap">Subir imagen</button>
        </form>
    </div>
</div>
</body>
</html>

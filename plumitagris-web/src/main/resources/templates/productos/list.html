<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Productos - Plumita Gris</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Productos</h2>
        <a href="/productos/nuevo" class="btn btn-success">+ Nuevo producto</a>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <table class="table table-striped table-bordered bg-white">
        <thead class="table-dark">
        <tr>
            <th>Imagen</th>
            <th>Nombre</th>
            <th>Descripción</th>
            <th>Precio</th>
            <th>Categoría</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${productos}">
            <td>
                <img th:if="${p.imagenUrl != null}" th:src="${fileBaseUrl + p.imagenUrl}"
                     alt="Imagen" style="width: 50px; height: 50px; object-fit: cover;" class="rounded">
                <span th:unless="${p.imagenUrl != null}" class="text-muted small">Sin imagen</span>
            </td>
            <td th:text="${p.nombre}"></td>
            <td th:text="${p.descripcion}"></td>
            <td th:text="${'$' + p.precio}"></td>
            <td th:text="${p.categoria != null ? p.categoria.nombre : '-'}"></td>
            <td>
                <a th:href="@{/productos/{id}/editar(id=${p.idProducto})}" class="btn btn-sm btn-warning">Editar</a>
                <form th:action="@{/productos/{id}/eliminar(id=${p.idProducto})}" method="post" style="display:inline"
                      onsubmit="return confirm('¿Eliminar este producto?');">
                    <button type="submit" class="btn btn-sm btn-danger">Eliminar</button>
                </form>
            </td>
        </tr>
        <tr th:if="${productos == null || productos.isEmpty()}">
            <td colspan="6" class="text-center text-muted">No hay productos registrados.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>

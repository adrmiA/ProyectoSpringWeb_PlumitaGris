<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - Plumita Gris</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container pg-page">
    <div class="pg-page-header">
        <h2>Productos</h2>
        <a href="/productos/nuevo" class="btn-pg-primary"><i class="bi bi-plus-lg me-1"></i>Nuevo producto</a>
    </div>

    <div th:if="${success}" class="pg-alert pg-alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="pg-alert pg-alert-danger" th:text="${error}"></div>

    <!-- Filtros de categoría: se generan dinámicamente en JS a partir de los productos listados -->
    <div class="pg-filters" id="pgCategoryFilters">
        <span class="pg-pill active" data-categoria="__todos__">Todos</span>
    </div>

    <div class="row g-4" id="pgProductGrid" th:if="${productos != null and !productos.isEmpty()}">
        <div class="col-6 col-md-4 col-lg-3 pg-product-item"
             th:each="p : ${productos}"
             th:attr="data-categoria=${p.categoria != null ? p.categoria.nombre : 'Sin categoría'}">
            <div class="pg-product-card" th:classappend="${p.activo != null and !p.activo} ? 'pg-product-inactive' : ''">
                <div class="pg-product-thumb">
                    <img th:if="${p.imagenUrl != null}" th:src="${fileBaseUrl + p.imagenUrl}" alt="Imagen">
                    <div class="no-img" th:unless="${p.imagenUrl != null}">Sin imagen</div>
                    <div class="pg-product-actions">
                        <form th:action="@{/productos/{id}/eliminar(id=${p.idProducto})}" method="post"
                              onsubmit="return confirm('¿Eliminar este producto? Si tiene pedidos asociados no se podrá eliminar; en ese caso, usa Desactivar.');">
                            <button type="submit" class="btn-pg-icon danger" title="Eliminar"><i class="bi bi-trash"></i></button>
                        </form>
                        <a th:href="@{/productos/{id}/editar(id=${p.idProducto})}" class="btn-pg-icon" title="Editar"><i class="bi bi-pencil"></i></a>
                        <form th:action="@{/productos/{id}/estado(id=${p.idProducto})}" method="post">
                            <input type="hidden" name="activo" th:value="${p.activo == null or p.activo} ? 'false' : 'true'">
                            <button type="submit" class="btn-pg-icon" th:title="${p.activo == null or p.activo} ? 'Desactivar' : 'Activar'">
                                <i th:class="${p.activo == null or p.activo} ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
                            </button>
                        </form>
                    </div>
                </div>
                <div class="pg-product-body">
                    <h6 th:text="${p.nombre}"></h6>
                    <p th:text="${p.descripcion}"></p>
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <span class="price" th:text="${'$' + p.precio}"></span>
                        <span class="pg-badge" th:if="${p.categoria != null}" th:text="${p.categoria.nombre}"></span>
                    </div>
                    <div class="d-flex justify-content-between align-items-center">
                        <small style="color: var(--pg-text-muted);"
                               th:text="'Disponibles: ' + (${existencias.get(p.idProducto)} != null ? ${existencias.get(p.idProducto)} : 0)"></small>
                        <small th:if="${p.activo != null and !p.activo}" class="pg-badge" style="opacity:0.7;">Inactivo</small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="pg-table-wrap pg-empty" id="pgNoProducts" th:if="${productos == null || productos.isEmpty()}">
        No hay productos registrados.
    </div>
    <div class="pg-table-wrap pg-empty pg-hidden" id="pgNoMatch">
        No hay productos en esta categoría.
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    (function () {
        var filtersWrap = document.getElementById('pgCategoryFilters');
        var items = Array.prototype.slice.call(document.querySelectorAll('.pg-product-item'));
        var noMatch = document.getElementById('pgNoMatch');

        if (!items.length) return;

        // Construye la lista de categorías únicas presentes en los productos
        var categorias = [];
        items.forEach(function (item) {
            var cat = item.getAttribute('data-categoria');
            if (cat && categorias.indexOf(cat) === -1) categorias.push(cat);
        });

        categorias.forEach(function (cat) {
            var pill = document.createElement('span');
            pill.className = 'pg-pill';
            pill.setAttribute('data-categoria', cat);
            pill.textContent = cat;
            filtersWrap.appendChild(pill);
        });

        filtersWrap.addEventListener('click', function (e) {
            var pill = e.target.closest('.pg-pill');
            if (!pill) return;

            filtersWrap.querySelectorAll('.pg-pill').forEach(function (p) { p.classList.remove('active'); });
            pill.classList.add('active');

            var selected = pill.getAttribute('data-categoria');
            var visibleCount = 0;

            items.forEach(function (item) {
                var match = selected === '__todos__' || item.getAttribute('data-categoria') === selected;
                item.classList.toggle('pg-hidden', !match);
                if (match) visibleCount++;
            });

            noMatch.classList.toggle('pg-hidden', visibleCount !== 0);
        });
    })();
</script>
</body>
</html>

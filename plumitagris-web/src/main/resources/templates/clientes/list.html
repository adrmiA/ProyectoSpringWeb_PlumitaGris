<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Clientes - Plumita Gris</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Clientes</h2>
        <a href="/clientes/nuevo" class="btn btn-success">+ Nuevo cliente</a>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <table class="table table-striped table-bordered bg-white">
        <thead class="table-dark">
        <tr>
            <th>Nombre</th>
            <th>Correo</th>
            <th>Dirección</th>
            <th>Teléfono</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${clientes}">
            <td th:text="${c.usuario != null ? c.usuario.nombre : '-'}"></td>
            <td th:text="${c.usuario != null ? c.usuario.correo : '-'}"></td>
            <td th:text="${c.direccion}"></td>
            <td th:text="${c.telefono}"></td>
            <td>
                <a th:href="@{/clientes/{id}/editar(id=${c.idCliente})}" class="btn btn-sm btn-warning">Editar</a>
                <form th:action="@{/clientes/{id}/eliminar(id=${c.idCliente})}" method="post" style="display:inline"
                      onsubmit="return confirm('¿Eliminar este cliente?');">
                    <button type="submit" class="btn btn-sm btn-danger">Eliminar</button>
                </form>
            </td>
        </tr>
        <tr th:if="${clientes == null || clientes.isEmpty()}">
            <td colspan="5" class="text-center text-muted">No hay clientes registrados.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>

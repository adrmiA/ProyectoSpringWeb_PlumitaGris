<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes - Plumita Gris</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container pg-page">
    <div class="pg-page-header">
        <h2>Clientes</h2>
        <a href="/clientes/nuevo" class="btn-pg-primary"><i class="bi bi-plus-lg me-1"></i>Nuevo cliente</a>
    </div>

    <div th:if="${success}" class="pg-alert pg-alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="pg-alert pg-alert-danger" th:text="${error}"></div>

    <div class="pg-table-wrap">
        <table class="pg-table" th:if="${clientes != null and !clientes.isEmpty()}">
            <thead>
            <tr>
                <th>Nombre</th>
                <th>Correo</th>
                <th>Dirección</th>
                <th>Teléfono</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${clientes}">
                <td th:text="${c.usuario != null ? c.usuario.nombre : '-'}"></td>
                <td th:text="${c.usuario != null ? c.usuario.correo : '-'}"></td>
                <td th:text="${c.direccion}"></td>
                <td th:text="${c.telefono}"></td>
                <td>
                    <div class="d-flex gap-2">
                        <a th:href="@{/clientes/{id}/editar(id=${c.idCliente})}" class="btn-pg-icon" title="Editar"><i class="bi bi-pencil"></i></a>
                        <form th:action="@{/clientes/{id}/eliminar(id=${c.idCliente})}" method="post"
                              onsubmit="return confirm('¿Eliminar este cliente?');">
                            <button type="submit" class="btn-pg-icon danger" title="Eliminar"><i class="bi bi-trash"></i></button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
        <div class="pg-empty" th:if="${clientes == null || clientes.isEmpty()}">
            No hay clientes registrados.
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

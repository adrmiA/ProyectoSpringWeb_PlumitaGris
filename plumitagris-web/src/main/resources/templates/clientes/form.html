<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${editar} ? 'Editar cliente' : 'Nuevo cliente'">Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container pg-page" style="max-width: 620px;">
    <div class="pg-page-header">
        <h2 th:text="${editar} ? 'Editar cliente' : 'Nuevo cliente'"></h2>
    </div>

    <div th:if="${error}" class="pg-alert pg-alert-danger" th:text="${error}"></div>

    <form th:action="${editar} ? @{/clientes/{id}(id=${clienteForm.idCliente})} : @{/clientes}"
          th:object="${clienteForm}" method="post" class="pg-form-card">

        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" class="form-control" th:field="*{nombre}" placeholder="Nombre completo">
            <div class="text-danger" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Correo</label>
            <input type="email" class="form-control" th:field="*{correo}" placeholder="correo@ejemplo.com">
            <div class="text-danger" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" class="form-control" th:field="*{contrasena}" placeholder="••••••••">
            <div class="form-text" th:if="${editar}">Vuelve a ingresarla para confirmar el cambio.</div>
            <div class="text-danger" th:if="${#fields.hasErrors('contrasena')}" th:errors="*{contrasena}"></div>
        </div>

        <div class="row">
            <div class="col-12 col-sm-6 mb-3">
                <label class="form-label">Dirección</label>
                <input type="text" class="form-control" th:field="*{direccion}" placeholder="Dirección">
            </div>
            <div class="col-12 col-sm-6 mb-3">
                <label class="form-label">Teléfono</label>
                <input type="text" class="form-control" th:field="*{telefono}" placeholder="Teléfono">
            </div>
        </div>

        <div class="d-flex gap-2 mt-3">
            <button type="submit" class="btn-pg-primary">Guardar</button>
            <a href="/clientes" class="btn-pg-outline">Cancelar</a>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

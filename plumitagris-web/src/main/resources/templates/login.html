<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Plumita Gris</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
<nav class="pg-navbar">
    <div class="container">
        <a class="pg-brand" href="/">Plumita<span>Gris</span></a>
    </div>
</nav>

<div class="pg-auth-wrap">
    <div class="pg-auth-card">
        <h2>Iniciar sesión</h2>
        <p class="pg-subtitle">Ingresa tus datos para acceder al panel</p>

        <div class="pg-alert pg-alert-danger" th:if="${param.error}">
            Correo o contraseña incorrectos.
        </div>
        <div class="pg-alert pg-alert-success" th:if="${param.logout}">
            Sesión cerrada correctamente.
        </div>
        <div class="pg-alert pg-alert-success" th:if="${param.registrado}">
            Cuenta creada correctamente. Ya puedes iniciar sesión.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label">Correo</label>
                <input type="email" name="correo" class="form-control" required autofocus placeholder="tucorreo@ejemplo.com">
            </div>
            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" name="contrasena" class="form-control" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-pg-primary w-100 mt-2">Entrar</button>
        </form>
    </div>
</div>
</body>
</html>

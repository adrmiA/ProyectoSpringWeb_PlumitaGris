<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>

<nav th:fragment="nav" class="pg-navbar">
    <div class="container">

        <a href="/"
           class="pg-brand"
           id="pgBrandMobile">
            Plumita<span>Gris</span>
        </a>

        <ul class="pg-nav-group">
            <li>
                <a href="/productos">
                    Productos
                </a>
            </li>
            <li>
                <a href="/">
                    Inicio
                </a>
            </li>
            <li>
                <a href="/"
                   class="pg-brand">
                    Plumita<span>Gris</span>
                </a>
            </li>

            <li>
                <a href="/clientes">
                    Clientes
                </a>
            </li>
            <li>
                <a href="/pedidos">
                    Pedidos
                </a>
            </li>
        </ul>

        <button class="pg-toggler"
                type="button"
                data-bs-toggle="offcanvas"
                data-bs-target="#pgMobileMenu"
                aria-controls="pgMobileMenu"
                aria-label="Abrir menú">
            <i class="bi bi-list"></i>
        </button>
    </div>
</nav>

<div class="offcanvas offcanvas-end pg-mobile-menu"
     tabindex="-1"
     id="pgMobileMenu"
     aria-labelledby="pgMobileMenuLabel">

    <!-- CABECERA -->
    <div class="offcanvas-header">
        <a href="/"
           class="pg-brand"
           id="pgMobileMenuLabel">
            Plumita<span>Gris</span>
        </a>
        <button type="button"
                class="btn-close btn-close-white"
                data-bs-dismiss="offcanvas"
                aria-label="Cerrar">
        </button>
    </div>
    <!-- CUERPO -->
    <div class="offcanvas-body">

        <div class="pg-mobile-links">
            <a href="/"
               data-bs-dismiss="offcanvas">
                <i class="bi bi-house"></i>
                <span>
                    Inicio
                </span>
            </a>
            <a href="/productos"
               data-bs-dismiss="offcanvas">
                <i class="bi bi-box-seam"></i>
                <span>
                    Productos
                </span>
            </a>

            <a href="/clientes"
               data-bs-dismiss="offcanvas">
                <i class="bi bi-people"></i>
                <span>
                    Clientes
                </span>
            </a>
            <a href="/pedidos"
               data-bs-dismiss="offcanvas">
                <i class="bi bi-receipt"></i>
                <span>
                    Pedidos
                </span>
            </a>
        </div>

        <div class="pg-mobile-user">

            <!-- USUARIO AUTENTICADO -->
            <div sec:authorize="isAuthenticated()">
                <p class="pg-user-pill"
                   sec:authentication="principal.nombre">
                    Usuario
                </p>

                <form th:action="@{/logout}"
                      method="post">
                    <button type="submit"
                            class="btn-pg-outline w-100">
                        <i class="bi bi-box-arrow-right me-2"></i>
                        Cerrar sesión
                    </button>
                </form>
            </div>

            <!-- USUARIO NO AUTENTICADO -->
            <div sec:authorize="!isAuthenticated()">
                <a href="/login"
                   class="btn-pg-primary w-100 text-center">
                    <i class="bi bi-box-arrow-in-right me-2"></i>
                    Iniciar sesión
                </a>
            </div>
        </div>
    </div>
</div>
</body>
</html>}
